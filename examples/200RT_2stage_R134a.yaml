# 200RT 공랭식 터보 냉동기 — 2단 압축 + 서브콘덴서, R134a
# 원본: LG150RT_2STG(AIR_134a) 시트
# [참고] 이 파일은 원본 엑셀을 그대로 옮긴 것이라 실행하면
#        "에너지 수지 오차 ... 확인 필요" 경고가 뜬다.
#        중간단 유량비 x 를 손으로 고정했기 때문이다.
#        subcond_mass_ratio 와 t_subcond 를 null 로 바꾸면 수지가 맞는다.
#        (보정한 설정은 150RT_2stage_권장.yaml 참고)
stages: 2

refrigerant: R134a
capacity_rt: 200

chilled_water_in: 12.2
chilled_water_out: 7.0
evap_approach: 1.0
superheat: 1.0

cooling_medium_in: 35.0
cond_approach: 15.0
subcool: 1.0

dp_suction: 5.0
dp_discharge: 13.0

eta_is_stage1: 0.80
eta_is_stage2: 0.80
eta_wire_to_shaft: 0.89

t_subcond: 30.0
subcond_mass_ratio: 0.1

t_cond_max: 70.0
eta_is_max: 0.80

hx: true
