# LG 150RT 공랭식 터보 냉동기 — 2단 압축 + 이코노마이저, R1234ze(E)
#
# 위 엑셀 재현용 예제와 조건은 같지만, 계산이 어긋나던 부분을 바로잡은 설정이다.
#   - 중간압을 sqrt(P1·P2) 로 자동 (두 단의 압축비가 고르게 나뉜다)
#   - 중간단 유량비를 이코노마이저 에너지 밸런스로 계산
# 이렇게 두면 에너지 수지 오차가 0 에 가깝게 떨어진다.
stages: 2

refrigerant: R1234ze(E)
capacity_rt: 150

chilled_water_in: 12.0
chilled_water_out: 7.0
evap_approach: 1.0
superheat: 1.0

cooling_medium_in: 35.0
cond_approach: 15.0
subcool: 3.0

dp_suction: 3.0
dp_discharge: 5.0

eta_is_stage1: 0.80
eta_is_stage2: 0.80
eta_wire_to_shaft: 0.89

t_subcond: null             # 중간압 자동 (sqrt(P1·P2))
subcond_mass_ratio: null    # 에너지 밸런스로 계산

t_cond_max: 70.0
eta_is_max: 0.80

hx: true
impeller:
  head_coefficient: 0.60
  specific_speed: 0.70
iplv:
  medium: air
